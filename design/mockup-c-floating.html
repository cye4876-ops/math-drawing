<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Math Drawing · 设计预览 C —— 画布优先浮动卡片风</title>
    <style>
      /* ============ 方案 C：画布优先 · 浮动卡片（Desmos 灵感） ============ */
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        font-display: swap;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 500;
        font-display: swap;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        font-display: swap;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        font-display: swap;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2')
          format('woff2');
      }

      :root {
        --font: Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        --text: #18181b;
        --dim: #71717a;
        --faint: #a1a1aa;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.09);
        --green: #16a34a;
        --border: #e8e8ec;
        --card: rgba(255, 255, 255, 0.94);
        --shadow-pop: 0 1px 2px rgba(24, 24, 27, 0.05), 0 14px 40px rgba(24, 24, 27, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        background: #fff;
      }

      .i {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .i.md {
        width: 18px;
        height: 18px;
      }
      .i.sm {
        width: 14px;
        height: 14px;
      }

      #plot {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
      }

      /* ============ 顶栏（毛玻璃，浮动） ============ */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(24, 24, 27, 0.06);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: 6px;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.4);
      }
      .brand-mark .i {
        width: 15px;
        height: 15px;
        stroke-width: 2.2;
      }
      .brand-name {
        font-weight: 650;
        font-size: 13.5px;
        letter-spacing: -0.01em;
      }

      .modes {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 4px;
      }
      .mode {
        padding: 5px 11px;
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--dim);
        cursor: pointer;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .mode:hover {
        background: rgba(24, 24, 27, 0.05);
        color: var(--text);
      }
      .mode.on {
        background: #fff;
        border-color: var(--border);
        color: var(--text);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(24, 24, 27, 0.08);
      }

      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .ibtn {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--dim);
        background: none;
        border: none;
        cursor: pointer;
      }
      .ibtn:hover {
        background: rgba(24, 24, 27, 0.06);
        color: var(--text);
      }
      .ibtn.disabled {
        color: #d4d4d8;
        cursor: default;
      }
      .ibtn.disabled:hover {
        background: none;
      }
      .vsep {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 6px;
      }

      /* ============ 浮动表达式卡片（左上） ============ */
      .expr-card {
        position: fixed;
        top: 62px;
        left: 16px;
        width: 336px;
        max-height: calc(100vh - 160px);
        display: flex;
        flex-direction: column;
        background: var(--card);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-pop);
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 6px;
      }
      .card-head .t {
        font-weight: 650;
        font-size: 13.5px;
      }
      .card-head .n {
        font-size: 11.5px;
        color: var(--dim);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 1px 8px;
      }
      .card-head .ibtn {
        margin-left: auto;
      }
      .card-head .ibtn + .ibtn {
        margin-left: 0;
      }

      .add-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 10px;
      }
      .color-dot {
        width: 20px;
        height: 20px;
        border-radius: 99px;
        background: #c32222;
        border: 3px solid #fff;
        box-shadow: 0 0 0 1.5px var(--border);
      }
      .add-input {
        flex: 1;
        height: 34px;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--text);
        font:
          500 13.5px ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        padding: 0 10px;
      }
      .add-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      }
      .add-btn {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 9px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .add-btn:hover {
        background: #1d4ed8;
      }
      .ok-line {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px 10px;
        font-size: 12px;
        color: var(--green);
      }
      .divider {
        height: 1px;
        background: var(--border);
      }

      .items {
        overflow-y: auto;
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .item {
        border: 1px solid transparent;
        border-radius: 11px;
        padding: 7px 8px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .item.sel {
        background: rgba(37, 99, 235, 0.045);
        border-color: rgba(37, 99, 235, 0.16);
      }
      .item-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 14px;
        height: 14px;
        flex: none;
        border-radius: 99px;
      }
      .item-name {
        flex: 1;
        font-weight: 550;
        font-size: 13px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item .ibtn {
        width: 26px;
        height: 26px;
        border-radius: 7px;
      }
      .expr-row2 {
        display: flex;
        align-items: center;
        gap: 7px;
        padding-left: 2px;
      }
      .prefix {
        color: var(--faint);
        font-style: italic;
        font-size: 12.5px;
      }
      .expr2 {
        flex: 1;
        height: 30px;
        min-width: 0;
        padding: 0 9px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        font:
          550 13px ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        color: var(--text);
      }
      .expr2:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      }
      .params {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--accent-soft);
        border-radius: 9px;
        padding: 8px 10px;
      }
      .param {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
      }
      .param .k {
        width: 12px;
        font-style: italic;
        color: var(--accent);
        font-weight: 650;
      }
      .param input[type='range'] {
        flex: 1;
        accent-color: var(--accent);
        height: 18px;
      }
      .param .v {
        width: 40px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 12px;
      }
      .opts {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--dim);
        padding-left: 2px;
      }
      .mini-select {
        height: 26px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 0 22px 0 8px;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 7px center;
      }
      .add-ghost {
        margin: 2px 10px 10px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--dim);
        font-size: 12.5px;
        cursor: pointer;
        background: none;
      }
      .add-ghost:hover {
        color: var(--accent);
        border-color: rgba(37, 99, 235, 0.4);
      }

      /* ============ 底部工具坞（中央浮动胶囊） ============ */
      .dock {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px 7px;
        background: var(--card);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow-pop);
        max-width: calc(100vw - 32px);
      }
      .tool {
        width: 50px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: none;
        color: var(--dim);
        cursor: pointer;
      }
      .tool .lbl {
        font-size: 10.5px;
        line-height: 1;
      }
      .tool:hover {
        background: rgba(24, 24, 27, 0.06);
        color: var(--text);
      }
      .tool.on {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
      }
      .tool.on:hover {
        background: var(--accent);
        color: #fff;
      }

      /* ============ 角落浮动件 ============ */
      .corner-bl {
        position: fixed;
        left: 16px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 12px;
        background: var(--card);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow:
          0 1px 2px rgba(24, 24, 27, 0.05),
          0 8px 24px rgba(24, 24, 27, 0.08);
        color: var(--dim);
        font-size: 12.5px;
      }
      .pill.save {
        color: var(--green);
        font-weight: 600;
      }
      .pill .badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        display: grid;
        place-items: center;
        background: rgba(24, 24, 27, 0.06);
        border-radius: 99px;
        font-size: 11px;
        color: var(--dim);
      }

      .corner-br {
        position: fixed;
        right: 16px;
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .zoom {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        padding: 0 6px;
        background: var(--card);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 11px;
        box-shadow:
          0 1px 2px rgba(24, 24, 27, 0.05),
          0 8px 24px rgba(24, 24, 27, 0.08);
      }
      .zoom .ibtn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .zoom .txt {
        padding: 0 8px;
        font-size: 12px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        line-height: 22px;
        margin: 0 2px;
      }
      .cursor-pill {
        height: 34px;
        border-radius: 11px;
      }

      /* ============ 追踪点气泡 ============ */
      .point-bubble {
        position: fixed;
        transform: translate(-50%, -100%);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        margin-bottom: 12px;
        background: #18181b;
        color: #fff;
        border-radius: 8px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 6px 20px rgba(24, 24, 27, 0.28);
        white-space: nowrap;
      }
      .point-bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -5px;
        transform: translateX(-50%) rotate(45deg);
        width: 10px;
        height: 10px;
        background: #18181b;
        border-radius: 2px;
      }
    </style>
  </head>

    <script>
      const canvas = document.getElementById('plot')
      const dpr = window.devicePixelRatio || 1
      function draw() {
        const w = window.innerWidth,
          h = window.innerHeight
        canvas.width = w * dpr
        canvas.height = h * dpr
        const ctx = canvas.getContext('2d')
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        ctx.clearRect(0, 0, w, h)

        const cx = w / 2,
          cy = h / 2 + 20,
          scale = 46

        ctx.strokeStyle = '#f4f4f6'
        ctx.lineWidth = 1
        for (let x = cx % (scale / 2); x < w; x += scale / 2) {
          ctx.beginPath()
          ctx.moveTo(x, 0)
          ctx.lineTo(x, h)
          ctx.stroke()
        }
        for (let y = cy % (scale / 2); y < h; y += scale / 2) {
          ctx.beginPath()
          ctx.moveTo(0, y)
          ctx.lineTo(w, y)
          ctx.stroke()
        }
        ctx.strokeStyle = '#e9e9ee'
        for (let i = -30; i < 60; i++) {
          const x = cx + i * scale
          if (x < 0 || x > w) continue
          ctx.beginPath()
          ctx.moveTo(x, 0)
          ctx.lineTo(x, h)
          ctx.stroke()
        }
        for (let i = -30; i < 60; i++) {
          const y = cy + i * scale
          if (y < 0 || y > h) continue
          ctx.beginPath()
          ctx.moveTo(0, y)
          ctx.lineTo(w, y)
          ctx.stroke()
        }
        ctx.strokeStyle = '#b6bcc8'
        ctx.lineWidth = 1.5
        ctx.beginPath()
        ctx.moveTo(0, cy)
        ctx.lineTo(w, cy)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(cx, 0)
        ctx.lineTo(cx, h)
        ctx.stroke()
        ctx.fillStyle = '#a1a1aa'
        ctx.font = '11px Inter, system-ui'
        ctx.textAlign = 'center'
        for (let i = -30; i < 60; i++) {
          const x = cx + i * scale
          if (x > 10 && x < w - 10 && i !== 0 && i % 2 === 0) ctx.fillText(String(i), x, cy + 15)
        }
        ctx.textAlign = 'right'
        for (let i = -30; i < 60; i++) {
          const y = cy + i * scale
          if (y > 16 && y < h - 8 && i !== 0 && i % 2 === 0) ctx.fillText(String(-i), cx - 7, y + 4)
        }
        ctx.textAlign = 'left'
        ctx.fillText('x', w - 16, cy - 8)
        ctx.fillText('y', cx + 8, 18)

        // 曲线 a·sin(b·x)
        ctx.strokeStyle = '#c32222'
        ctx.lineWidth = 2.5
        ctx.lineJoin = 'round'
        ctx.lineCap = 'round'
        ctx.beginPath()
        let started = false
        for (let px = 0; px <= w; px += 2) {
          const x = (px - cx) / scale
          const py = cy - 1.5 * Math.sin(2 * x) * scale
          if (!started) {
            ctx.moveTo(px, py)
            started = true
          } else ctx.lineTo(px, py)
        }
        ctx.stroke()

        // 曲线 x²/4
        ctx.strokeStyle = '#15803d'
        ctx.lineWidth = 2
        ctx.setLineDash([8, 6])
        ctx.beginPath()
        started = false
        for (let px = 0; px <= w; px += 2) {
          const x = (px - cx) / scale
          const py = cy - ((x * x) / 4) * scale
          if (py < -80 || py > h + 80) {
            started = false
            continue
          }
          if (!started) {
            ctx.moveTo(px, py)
            started = true
          } else ctx.lineTo(px, py)
        }
        ctx.stroke()
        ctx.setLineDash([])

        // 追踪点
        const tx = 1.29,
          ty = 1.5 * Math.sin(2 * tx)
        const px = cx + tx * scale,
          py = cy - ty * scale
        ctx.beginPath()
        ctx.arc(px, py, 6, 0, Math.PI * 2)
        ctx.fillStyle = '#2563eb'
        ctx.fill()
        ctx.lineWidth = 2
        ctx.strokeStyle = '#fff'
        ctx.stroke()

        // 气泡位置
        const bubble = document.getElementById('bubble')
        bubble.style.left = px + 'px'
        bubble.style.top = py - 6 + 'px'
      }
      draw()
      window.addEventListener('resize', draw)
    </script>
