name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 许可证扫描
        run: pnpm check:licenses
      - name: 类型检查
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: 单元测试
        run: pnpm test
      - name: 构建
        run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 端到端测试
        run: pnpm test:e2e
